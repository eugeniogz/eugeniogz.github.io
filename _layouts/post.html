---
layout: default
---

<article class="post">
  <h2>{{ page.title | escape }}</h2>
  <p class="post-meta">
    Posted on {{ page.date | date: "%b %-d, %Y" }}
    {% if page.author %} by {{ page.author }}{% endif %}
  </p>
  
  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
    <div class="post-tags">
      <span class="post-tags-label">Tags:</span>
      {% for tag in page.tags %}
        <a href="{{ '/Search.html' | relative_url }}?q={{ tag | url_encode }}" class="microblog-tag">#{{ tag }}</a>
      {% endfor %}
    </div>
  {% endif %}
</article>
