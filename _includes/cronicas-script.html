<script id="cronicas-data" type="application/json">
{{ site.data.cronicas | jsonify }}
</script>
<script>
(function() {
  if (window.__cronicasInitialized) return;
  const container = document.getElementById('cronicas-app');
  if (!container) return;
  window.__cronicasInitialized = true;

  const pathname = window.location.pathname;

  const baseUrl = pathname.includes('/cronicas/')
    ? pathname.substring(0, pathname.indexOf('/cronicas/') + '/cronicas/'.length)
    : (pathname.includes('/cronicas-1/') ? pathname.substring(0, pathname.indexOf('/cronicas-1/')) + '/'
    : (pathname.includes('/cronicas-2/') ? pathname.substring(0, pathname.indexOf('/cronicas-2/')) + '/'
    : (pathname.includes('/cronicas-3/') ? pathname.substring(0, pathname.indexOf('/cronicas-3/')) + '/'
    : (pathname.includes('/breves-cronicas/') ? pathname.substring(0, pathname.indexOf('/breves-cronicas/')) + '/'
    : '/cronicas/'))));

  const dataEl = document.getElementById('cronicas-data');
  let rawVolumes = [];
  try {
    rawVolumes = dataEl ? JSON.parse(dataEl.textContent || '[]') : [];
  } catch (e) {
    rawVolumes = [];
  }

  const volumes = (rawVolumes || []).map(v => ({
    ...v,
    url: baseUrl + (v.folder || (v.id + '/')),
    stories: (v.stories || []).map(s => ({
      ...s,
      url: baseUrl + (s.filename || (s.id + '.html'))
    }))
  }));

  // Identificação da rota
  const isMasterIndex = pathname.endsWith('/cronicas/') || pathname.endsWith('/cronicas/index.html') || pathname.endsWith('/cronicas');
  const isVol1Index = pathname.endsWith('/cronicas-1/') || pathname.endsWith('/cronicas-1/index.html') || pathname.endsWith('/cronicas-1');
  const isVol2Index = pathname.endsWith('/cronicas-2/') || pathname.endsWith('/cronicas-2/index.html') || pathname.endsWith('/cronicas-2');
  const isVol3Index = pathname.endsWith('/cronicas-3/') || pathname.endsWith('/cronicas-3/index.html') || pathname.endsWith('/cronicas-3');
  const isBrevesIndex = pathname.endsWith('/breves-cronicas/') || pathname.endsWith('/breves-cronicas/index.html') || pathname.endsWith('/breves-cronicas');

  if (isMasterIndex) {
    renderMasterHub();
    return;
  }

  if (isVol1Index) {
    renderVolumeHub(volumes[0]);
    return;
  }
  if (isVol2Index) {
    renderVolumeHub(volumes[1]);
    return;
  }
  if (isVol3Index) {
    renderVolumeHub(volumes[2]);
    return;
  }
  if (isBrevesIndex) {
    renderVolumeHub(volumes[3]);
    return;
  }

  // Página individual de crônica
  renderChronicleReader();

  function renderMasterHub() {
    const totalStories = volumes.reduce((acc, v) => acc + v.count, 0);

    container.innerHTML = `
      <div class="cronicas-hero">
        <div class="cronicas-hero-badge">
          <span>☕</span> Cotidiano & Filosofia
        </div>
        <h1 class="cronicas-hero-title">Crônicas Diárias</h1>
        <p class="cronicas-hero-subtitle">
          Sentimentos, percepções e filosofia no cotidiano. Crônicas que revelam a arte da atenção plena, os laços humanos e o florescimento do espírito.
        </p>

        <div class="cronicas-stats-pills">
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">📚</span>
            <span><strong>${totalStories}</strong> Crônicas no Total</span>
          </div>
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">📖</span>
            <span><strong>4</strong> Volumes Temáticos</span>
          </div>
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">⏱️</span>
            <span>Leituras de 1 a 3 min</span>
          </div>
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">🔊</span>
            <span>Áudio Narração</span>
          </div>
        </div>
      </div>

      <!-- Barra de Navegação de Volumes -->
      <div class="cronicas-vol-nav">
        <a href="${baseUrl}" class="cronicas-vol-nav-item active">Visão Geral dos Volumes</a>
        <a href="${volumes[0].url}" class="cronicas-vol-nav-item">Volume 1 (11)</a>
        <a href="${volumes[1].url}" class="cronicas-vol-nav-item">Volume 2 (8)</a>
        <a href="${volumes[2].url}" class="cronicas-vol-nav-item">Volume 3 (5)</a>
        <a href="${volumes[3].url}" class="cronicas-vol-nav-item">Breves (1)</a>
      </div>

      <!-- Grid de Volumes -->
      <div class="cronicas-volumes-grid">
        ${volumes.map(vol => `
          <div class="cronicas-volume-card">
            <div class="cronicas-volume-card-header">
              <span class="cronicas-volume-badge">${vol.badge}</span>
              <span class="cronicas-volume-meta">⏱️ ${vol.timeTotal} · ${vol.count} crônicas</span>
            </div>
            <h2 class="cronicas-volume-title">
              <a href="${vol.url}">${vol.title}: ${vol.subtitle}</a>
            </h2>
            <p class="cronicas-volume-desc">${vol.desc}</p>
            
            <div class="cronicas-volume-story-list">
              ${vol.stories.slice(0, 4).map(st => `
                <a href="${st.url}" class="cronicas-mini-link">
                  <span>📄 ${st.title}</span>
                  <span class="cronicas-mini-time">${st.time}</span>
                </a>
              `).join('')}
              ${vol.stories.length > 4 ? `
                <a href="${vol.url}" class="cronicas-see-more-link">
                  + ver todas as ${vol.stories.length} crônicas do ${vol.title} →
                </a>
              ` : ''}
            </div>

            <div class="cronicas-volume-footer">
              <a href="${vol.url}" class="cronicas-read-vol-btn">
                <span>Abrir ${vol.title}</span>
                <span>→</span>
              </a>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderVolumeHub(vol) {
    container.innerHTML = `
      <div class="cronicas-hero">
        <div class="cronicas-hero-badge">
          <span>${vol.badge}</span>
        </div>
        <h1 class="cronicas-hero-title">${vol.title}: ${vol.subtitle}</h1>
        <p class="cronicas-hero-subtitle">${vol.desc}</p>

        <div class="cronicas-stats-pills">
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">📄</span>
            <span><strong>${vol.count}</strong> Crônicas</span>
          </div>
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">⏱️</span>
            <span><strong>${vol.timeTotal}</strong> Leitura do Volume</span>
          </div>
          <div class="cronicas-stat-pill">
            <span class="cronicas-stat-icon">☕</span>
            <span>Atenção e Cotidiano</span>
          </div>
        </div>
      </div>

      <!-- Barra de Navegação de Volumes -->
      <div class="cronicas-vol-nav">
        <a href="${baseUrl}" class="cronicas-vol-nav-item">← Todos os Volumes</a>
        <a href="${volumes[0].url}" class="cronicas-vol-nav-item ${vol.id === 'cronicas-1' ? 'active' : ''}">Volume 1</a>
        <a href="${volumes[1].url}" class="cronicas-vol-nav-item ${vol.id === 'cronicas-2' ? 'active' : ''}">Volume 2</a>
        <a href="${volumes[2].url}" class="cronicas-vol-nav-item ${vol.id === 'cronicas-3' ? 'active' : ''}">Volume 3</a>
        <a href="${volumes[3].url}" class="cronicas-vol-nav-item ${vol.id === 'breves-cronicas' ? 'active' : ''}">Breves</a>
      </div>

      <!-- Grid de Crônicas do Volume -->
      <div class="cronicas-grid">
        ${vol.stories.map((st, idx) => `
          <article class="cronicas-card">
            <div class="cronicas-card-top">
              <span class="cronicas-card-num">#${idx + 1}</span>
              <span class="cronicas-card-time">⏱️ ${st.time}</span>
            </div>
            <h2 class="cronicas-card-title">
              <a href="${st.url}">${st.title}</a>
            </h2>
            <p class="cronicas-card-desc">${st.desc}</p>
            <div class="cronicas-card-footer">
              <a href="${st.url}" class="cronicas-read-btn">
                <span>Ler Crônica</span>
                <span>→</span>
              </a>
            </div>
          </article>
        `).join('')}
      </div>
    `;
  }

  function renderChronicleReader() {
    let currentVol = null;
    let currentStory = null;
    let currentStoryIndex = -1;

    const pageFilename = pathname.split('/').pop().replace(/\.html$/, '');

    // Localiza a crônica atual
    for (let v of volumes) {
      for (let i = 0; i < v.stories.length; i++) {
        const s = v.stories[i];
        const sFilename = s.url.split('/').pop().replace(/\.html$/, '');
        if (pageFilename === sFilename || pageFilename === s.id) {
          currentVol = v;
          currentStory = s;
          currentStoryIndex = i;
          break;
        }
      }
      if (currentStory) break;
    }

    if (!currentStory) {
      currentVol = volumes[0] || { id: 'cronicas-1', title: 'Crônicas', url: baseUrl, stories: [] };
      currentStory = (currentVol.stories && currentVol.stories[0]) || {
        id: 'cronica',
        title: (container.querySelector('h1, h2') || {}).innerText || 'Crônica',
        time: '1 min',
        url: baseUrl
      };
      currentStoryIndex = 0;
    }

    const currentStories = (currentVol && currentVol.stories) || [];
    const prevStory = currentStoryIndex > 0 ? currentStories[currentStoryIndex - 1] : null;
    const nextStory = (currentStoryIndex >= 0 && currentStoryIndex < currentStories.length - 1) ? currentStories[currentStoryIndex + 1] : null;

    const rawNodes = Array.from(container.childNodes);
    const bodyElements = [];

    rawNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      const tagName = node.tagName.toLowerCase();
      if (tagName === 'h3' && (node.querySelector('a[href*="./"]') || node.innerText.toLowerCase().includes('crônicas'))) return;
      if (tagName === 'h2' && node.innerText.trim().toLowerCase() === (currentStory.title || '').toLowerCase()) return;
      if (tagName === 'hr') return;
      if (tagName === 'div' && (node.innerText.includes('<<') || node.innerText.includes('>>') || node.style.clear === 'both')) return;
      bodyElements.push(node.cloneNode(true));
    });

    container.innerHTML = `
      <div class="cronicas-reading-bar" id="cronicas-reading-bar">
        <div class="cronicas-reading-bar-left">
          <a href="${currentVol.url || baseUrl}" class="cronicas-nav-back-btn" title="Voltar ao Volume">
            <span>←</span> <span class="cronicas-nav-back-text">${currentVol.title || 'Volume'}</span>
          </a>
        </div>
        <div class="cronicas-reading-controls">
          <button id="cronicas-copy-btn" class="cronicas-control-btn" title="Copiar crônica completa" aria-label="Copiar Crônica">
            <span>📋</span> <span id="cronicas-copy-label">Copiar</span>
          </button>
          <button id="cronicas-audio-btn" class="cronicas-control-btn audio-btn" title="Ouvir crônica" aria-label="Ouvir Crônica">
            <span id="audio-icon">🔊</span> <span id="audio-label">Ouvir</span>
          </button>
        </div>
        <div class="cronicas-progress-track">
          <div class="cronicas-progress-bar" id="cronicas-progress-bar"></div>
        </div>
      </div>

      <article class="cronicas-article" id="cronicas-article">
        <header class="cronicas-article-header">
          <div class="cronicas-meta-top">
            <span class="cronicas-badge-pill">${currentVol.title || 'Crônicas'}</span>
            <span class="cronicas-time-pill">⏱️ ${currentStory.time || '1 min'} de leitura</span>
          </div>
          <h1 class="cronicas-article-title">${currentStory.title || 'Crônica'}</h1>
        </header>

        <div class="cronicas-article-body" id="cronicas-body"></div>

        <nav class="cronicas-nav-footer" aria-label="Navegação entre crônicas">
          ${prevStory ? `
            <a href="${prevStory.url}" class="cronicas-nav-card prev">
              <span class="cronicas-nav-dir">← Crônica Anterior</span>
              <span class="cronicas-nav-title">${prevStory.title}</span>
            </a>
          ` : `
            <a href="${currentVol.url}" class="cronicas-nav-card prev">
              <span class="cronicas-nav-dir">← Volume</span>
              <span class="cronicas-nav-title">${currentVol.title}</span>
            </a>
          `}

          <a href="${currentVol.url}" class="cronicas-center-link" title="Voltar ao Volume">
            <span>☕</span> <span>${currentVol.title}</span>
          </a>

          ${nextStory ? `
            <a href="${nextStory.url}" class="cronicas-nav-card next">
              <span class="cronicas-nav-dir">Próxima Crônica →</span>
              <span class="cronicas-nav-title">${nextStory.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="cronicas-nav-card next">
              <span class="cronicas-nav-dir">Todos os Volumes →</span>
              <span class="cronicas-nav-title">Índice Geral</span>
            </a>
          `}
        </nav>
      </article>
    `;

    const bodyEl = document.getElementById('cronicas-body');
    bodyElements.forEach(el => bodyEl.appendChild(el));

    setupCronicasInteractions(currentStory);
  }

  function setupCronicasInteractions(currentStory) {
    const copyBtn = document.getElementById('cronicas-copy-btn');
    const bodyEl = document.getElementById('cronicas-body');

    if (copyBtn && bodyEl) {
      copyBtn.addEventListener('click', () => {
        const textToCopy = `${currentStory.title}\n\n` + bodyEl.innerText.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = '<span>✓</span> <span>Copiado!</span>';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.innerHTML = originalHTML;
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        }
      });
    }

    const progressBar = document.getElementById('cronicas-progress-bar');
    if (progressBar) {
      window.addEventListener('scroll', () => {
        const docEl = document.documentElement;
        const scrollTop = docEl.scrollTop || document.body.scrollTop;
        const scrollHeight = docEl.scrollHeight - docEl.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
      }, { passive: true });
    }

    const audioBtn = document.getElementById('cronicas-audio-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioLabel = document.getElementById('audio-label');
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let utterance = null;

    if (audioBtn && synth) {
      audioBtn.addEventListener('click', () => {
        if (isPlaying) {
          synth.cancel();
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
          return;
        }

        const bodyEl = document.getElementById('cronicas-body');
        const textToRead = bodyEl ? bodyEl.innerText : '';
        if (!textToRead) return;

        synth.cancel();
        utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;

        utterance.onstart = () => {
          isPlaying = true;
          audioBtn.classList.add('speaking');
          if (audioIcon) audioIcon.textContent = '⏹️';
          if (audioLabel) audioLabel.textContent = 'Parar';
        };

        utterance.onend = () => {
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
        };

        utterance.onerror = () => {
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
        };

        synth.speak(utterance);
      });
    }
  }
})();
</script>
