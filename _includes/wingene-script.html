<script id="wingene-data" type="application/json">
{{ site.data.wingene | jsonify }}
</script>
<script>
(function() {
  if (window.__wingeneInitialized) return;
  const container = document.getElementById('wingene-app');
  if (!container) return;
  window.__wingeneInitialized = true;

  const pathname = window.location.pathname;
  const isIndex = pathname.endsWith('/wingene/') || 
                  pathname.endsWith('/wingene/index.html') || 
                  pathname.endsWith('/wingene');

  const baseUrl = pathname.includes('/wingene/')
    ? pathname.substring(0, pathname.indexOf('/wingene/') + '/wingene/'.length)
    : '/wingene/';

  const dataEl = document.getElementById('wingene-data');
  let rawEssays = [];
  try {
    rawEssays = dataEl ? JSON.parse(dataEl.textContent || '[]') : [];
  } catch (e) {
    rawEssays = [];
  }

  const essays = (rawEssays || []).map(e => ({
    ...e,
    url: baseUrl + (e.filename || (e.id + '.html'))
  }));

  if (isIndex) {
    renderIndexHub();
    return;
  }

  renderEssayReader();

  function renderIndexHub() {
    container.innerHTML = `
      <div class="wingene-hero">
        <div class="wingene-hero-badge">
          <span>🌿</span> Filosofia & Prática da Herança Consciente
        </div>
        <h1 class="wingene-hero-title">Ensaios Filosóficos Wingene</h1>
        <p class="wingene-hero-subtitle">
          A fusão entre vitória e herança (win + gene). Ensaios sobre a evolução moral, o florescimento do espírito, a metaconsciência e o Método VIDA na prática.
        </p>

        <div class="wingene-stats-pills">
          <div class="wingene-stat-pill">
            <span class="wingene-stat-icon">📜</span>
            <span><strong>${essays.length}</strong> Ensaios Fundamentais</span>
          </div>
          <div class="wingene-stat-pill">
            <span class="wingene-stat-icon">⏱️</span>
            <span><strong>54 min</strong> Leitura Completa</span>
          </div>
          <div class="wingene-stat-pill">
            <span class="wingene-stat-icon">🧭</span>
            <span><strong>4</strong> Pilares (VIDA)</span>
          </div>
          <div class="wingene-stat-pill">
            <span class="wingene-stat-icon">🔊</span>
            <span>Áudio & Leitura Guiada</span>
          </div>
        </div>
      </div>

      <!-- Filtros de Categoria -->
      <div class="wingene-filters-bar" role="tablist" aria-label="Filtrar ensaios por tema">
        <button class="wingene-filter-btn active" data-filter="all" role="tab" aria-selected="true">
          ✨ Todos os Ensaios (${essays.length})
        </button>
        <button class="wingene-filter-btn" data-filter="fundamentos" role="tab" aria-selected="false">
          🌱 Fundamentos Wingene
        </button>
        <button class="wingene-filter-btn" data-filter="metodo-vida" role="tab" aria-selected="false">
          🧭 Método VIDA
        </button>
        <button class="wingene-filter-btn" data-filter="consciencia" role="tab" aria-selected="false">
          🧠 Mente & Metaconsciência
        </button>
        <button class="wingene-filter-btn" data-filter="aprimoramento" role="tab" aria-selected="false">
          🎨 Obra Pessoal
        </button>
      </div>

      <!-- Grid de Cartões -->
      <div class="wingene-grid" id="wingene-essays-grid">
        ${essays.map(essay => `
          <article class="wingene-card" data-category="${essay.category}">
            <div class="wingene-card-content">
              <div class="wingene-card-header-meta">
                <span class="wingene-card-num">Ensaio #${essay.number}</span>
                <span class="wingene-card-time">⏱️ ${essay.time}</span>
              </div>
              <h2 class="wingene-card-title">
                <a href="${essay.url}">${essay.title}</a>
              </h2>
              <div class="wingene-card-tags">
                ${essay.tags.map(t => `<span class="wingene-tag">${t}</span>`).join('')}
              </div>
              <p class="wingene-card-desc">${essay.desc}</p>
              <div class="wingene-card-footer">
                <a href="${essay.url}" class="wingene-read-btn">
                  <span>Ler Ensaio</span>
                  <span class="wingene-read-arrow">→</span>
                </a>
              </div>
            </div>
          </article>
        `).join('')}
      </div>

      <div class="wingene-synthesis-box">
        <div class="wingene-synthesis-icon">✨</div>
        <div class="wingene-synthesis-content">
          <h3>O Ideal de Eudaimonia e Futuro Ancestral</h3>
          <p>
            A Wingene propõe que o maior legado humano não são os bens acumulados, mas a qualidade da consciência e dos valores que cultivamos. Cada reflexão aqui contida é um convite para desacelerar o piloto automático e tecer a própria vida com presença e lucidez.
          </p>
        </div>
      </div>
    `;

    // Filtros
    const filterBtns = container.querySelectorAll('.wingene-filter-btn');
    const cards = container.querySelectorAll('.wingene-card');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        const filter = btn.getAttribute('data-filter');
        cards.forEach(c => {
          if (filter === 'all' || c.getAttribute('data-category') === filter) {
            c.style.display = 'flex';
          } else {
            c.style.display = 'none';
          }
        });
      });
    });
  }

  function renderEssayReader() {
    let currentEssay = null;
    let currentIndex = -1;
    const pageFilename = pathname.split('/').pop().replace(/\.html$/, '');

    for (let i = 0; i < essays.length; i++) {
      const essayFilename = essays[i].url.split('/').pop().replace(/\.html$/, '');
      if (pageFilename === essayFilename || pageFilename === essays[i].id) {
        currentEssay = essays[i];
        currentIndex = i;
        break;
      }
    }

    if (!currentEssay) {
      const originalH2 = container.querySelector('h2');
      const headingText = originalH2 ? originalH2.innerText.trim().toLowerCase() : '';
      if (headingText) {
        for (let i = 0; i < essays.length; i++) {
          if (headingText.includes(essays[i].title.toLowerCase()) || essays[i].title.toLowerCase().includes(headingText)) {
            currentEssay = essays[i];
            currentIndex = i;
            break;
          }
        }
      }
    }

    if (!currentEssay) {
      currentEssay = essays[0] || {
        id: 'ensaio',
        number: 1,
        title: (container.querySelector('h1, h2') || {}).innerText || 'Ensaio Wingene',
        time: '3 min',
        tags: ['Wingene'],
        url: baseUrl
      };
      currentIndex = 0;
    }

    const prevEssay = currentIndex > 0 ? essays[currentIndex - 1] : null;
    const nextEssay = (currentIndex >= 0 && currentIndex < essays.length - 1) ? essays[currentIndex + 1] : null;

    // Coleta nós do conteúdo
    const rawNodes = Array.from(container.childNodes);
    const bodyElements = [];

    rawNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      const tagName = node.tagName.toLowerCase();
      if (tagName === 'h3' && (node.querySelector('a[href*="./"]') || node.innerText.toLowerCase().includes('wingene'))) return;
      if (tagName === 'h2' && node.innerText.trim().toLowerCase().includes((currentEssay.title || '').split(':')[0].trim().toLowerCase())) return;
      if (tagName === 'hr') return;
      if (tagName === 'div' && (node.innerText.includes('<<') || node.innerText.includes('>>') || node.style.clear === 'both')) return;
      bodyElements.push(node.cloneNode(true));
    });

    const tagsList = currentEssay.tags || [];

    container.innerHTML = `
      <!-- Barra de Leitura Superior -->
      <div class="wingene-reading-bar" id="wingene-reading-bar">
        <div class="wingene-reading-bar-left">
          <a href="${baseUrl}" class="wingene-nav-back-btn" title="Voltar ao Índice de Ensaios">
            <span>←</span> <span class="wingene-nav-back-text">Índice Wingene</span>
          </a>
        </div>

        <div class="wingene-reading-controls">
          <button id="wingene-copy-btn" class="wingene-control-btn" title="Copiar texto do ensaio" aria-label="Copiar Ensaio">
            <span>📋</span> <span id="wingene-copy-label">Copiar</span>
          </button>

          <button id="wingene-audio-btn" class="wingene-control-btn audio-btn" title="Ouvir ensaio" aria-label="Ouvir Ensaio">
            <span id="audio-icon">🔊</span> <span id="audio-label">Ouvir</span>
          </button>
        </div>

        <div class="wingene-progress-track">
          <div class="wingene-progress-bar" id="wingene-progress-bar"></div>
        </div>
      </div>

      <!-- Artigo Principal -->
      <article class="wingene-article" id="wingene-article">
        <header class="wingene-article-header">
          <div class="wingene-meta-top">
            <span class="wingene-num-badge">Ensaio #${currentEssay.number || 1}</span>
            <span class="wingene-time-badge">⏱️ ${currentEssay.time || '3 min'} de leitura</span>
          </div>
          <h1 class="wingene-article-title">${currentEssay.title || 'Ensaio'}</h1>
          <div class="wingene-article-tags">
            ${tagsList.map(t => `<span class="wingene-tag">${t}</span>`).join('')}
          </div>
        </header>

        <div class="wingene-article-body" id="wingene-article-body"></div>

        <!-- Rodapé de Navegação -->
        <nav class="wingene-nav-footer" aria-label="Navegação entre ensaios">
          ${prevEssay ? `
            <a href="${prevEssay.url}" class="wingene-nav-card prev">
              <span class="wingene-nav-dir">← Ensaio Anterior</span>
              <span class="wingene-nav-title">${prevEssay.number}. ${prevEssay.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="wingene-nav-card prev">
              <span class="wingene-nav-dir">← Coleção</span>
              <span class="wingene-nav-title">Índice Geral</span>
            </a>
          `}

          <a href="${baseUrl}" class="wingene-center-link" title="Voltar ao Índice">
            <span>🌿</span> <span>Todos os Ensaios</span>
          </a>

          ${nextEssay ? `
            <a href="${nextEssay.url}" class="wingene-nav-card next">
              <span class="wingene-nav-dir">Próximo Ensaio →</span>
              <span class="wingene-nav-title">${nextEssay.number}. ${nextEssay.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="wingene-nav-card next">
              <span class="wingene-nav-dir">Fim dos Ensaios →</span>
              <span class="wingene-nav-title">Voltar ao Início</span>
            </a>
          `}
        </nav>
      </article>
    `;

    const articleBody = document.getElementById('wingene-article-body');
    bodyElements.forEach(el => articleBody.appendChild(el));

    setupReadingInteractions(currentEssay, currentEssay.id === 'the-vida-method' ? 'en-US' : 'pt-BR');
  }

  function setupReadingInteractions(currentEssay, langCode) {
    const copyBtn = document.getElementById('wingene-copy-btn');
    const bodyEl = document.getElementById('wingene-article-body');

    if (copyBtn && bodyEl) {
      copyBtn.addEventListener('click', () => {
        const textToCopy = `${currentEssay.title}\n\n` + bodyEl.innerText.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = '<span>✓</span> <span>Copiado!</span>';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.innerHTML = originalHTML;
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        }
      });
    }

    // Progress Bar
    const progressBar = document.getElementById('wingene-progress-bar');
    if (progressBar) {
      window.addEventListener('scroll', () => {
        const docEl = document.documentElement;
        const scrollTop = docEl.scrollTop || document.body.scrollTop;
        const scrollHeight = docEl.scrollHeight - docEl.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
      }, { passive: true });
    }

    // Audio Narration
    const audioBtn = document.getElementById('wingene-audio-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioLabel = document.getElementById('audio-label');
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let utterance = null;

    if (audioBtn && synth) {
      audioBtn.addEventListener('click', () => {
        if (isPlaying) {
          synth.cancel();
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
          return;
        }

        const bodyEl = document.getElementById('wingene-article-body');
        const textToRead = bodyEl ? bodyEl.innerText : '';
        if (!textToRead) return;

        synth.cancel();
        utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = langCode || 'pt-BR';
        utterance.rate = 1.0;

        utterance.onstart = () => {
          isPlaying = true;
          audioBtn.classList.add('speaking');
          if (audioIcon) audioIcon.textContent = '⏹️';
          if (audioLabel) audioLabel.textContent = 'Parar';
        };

        utterance.onend = () => {
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
        };

        utterance.onerror = () => {
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
        };

        synth.speak(utterance);
      });
    }
  }
})();
</script>
