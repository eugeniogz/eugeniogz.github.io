<script id="ipes-data" type="application/json">
{{ site.data.ipes | jsonify }}
</script>
<script>
(function() {
  if (window.__ipesInitialized) return;
  const container = document.getElementById('ipes-app');
  if (!container) return;
  window.__ipesInitialized = true;

  const pathname = window.location.pathname;
  const isIndex = pathname.endsWith('/ipes-e-tijolos/') || 
                  pathname.endsWith('/ipes-e-tijolos/index.html') || 
                  pathname.endsWith('/ipes-e-tijolos');

  const baseUrl = pathname.includes('/ipes-e-tijolos/')
    ? pathname.substring(0, pathname.indexOf('/ipes-e-tijolos/') + '/ipes-e-tijolos/'.length)
    : '/ipes-e-tijolos/';

  const dataEl = document.getElementById('ipes-data');
  let rawEssays = [];
  try {
    rawEssays = dataEl ? JSON.parse(dataEl.textContent || '[]') : [];
  } catch (e) {
    rawEssays = [];
  }

  const essays = (rawEssays || []).map(e => ({
    ...e,
    url: baseUrl + (e.filename || (e.id + '.html'))
  }));

  if (isIndex) {
    renderIndexHub();
    return;
  }

  renderEssayReader();

  function renderIndexHub() {
    container.innerHTML = `
      <div class="ipes-hero">
        <div class="ipes-hero-badge">
          <span>🧱</span> Reflexões & Ensaios
        </div>
        <h1 class="ipes-hero-title">Ipês e Tijolos</h1>
        <p class="ipes-hero-subtitle">
          Reflexões sobre o humano entre o concreto e o ideal. Ensaios que investigam o espírito material, a mente, a sociedade e a construção do futuro ancestral.
        </p>

        <div class="ipes-stats-pills">
          <div class="ipes-stat-pill">
            <span class="ipes-stat-icon">📚</span>
            <span><strong>${essays.length}</strong> Ensaios Filosóficos</span>
          </div>
          <div class="ipes-stat-pill">
            <span class="ipes-stat-icon">⏱️</span>
            <span><strong>14 min</strong> Leitura Total</span>
          </div>
          <div class="ipes-stat-pill">
            <span class="ipes-stat-icon">🌸</span>
            <span>Natureza & Cidade</span>
          </div>
          <div class="ipes-stat-pill">
            <span class="ipes-stat-icon">🔊</span>
            <span>Áudio Narração</span>
          </div>
        </div>
      </div>

      <!-- Filtros de Categoria -->
      <div class="ipes-filters-bar" role="tablist" aria-label="Filtrar ensaios por tema">
        <button class="ipes-filter-btn active" data-filter="all" role="tab" aria-selected="true">
          ✨ Todos (${essays.length})
        </button>
        <button class="ipes-filter-btn" data-filter="mente" role="tab" aria-selected="false">
          🧠 Mente & Espírito
        </button>
        <button class="ipes-filter-btn" data-filter="sociedade" role="tab" aria-selected="false">
          🏙️ Sociedade & Concreto
        </button>
        <button class="ipes-filter-btn" data-filter="liberdade" role="tab" aria-selected="false">
          🔥 Liberdade & Razão
        </button>
        <button class="ipes-filter-btn" data-filter="futuro" role="tab" aria-selected="false">
          🌱 Futuro Ancestral
        </button>
      </div>

      <!-- Grid de Cartões -->
      <div class="ipes-grid" id="ipes-grid">
        ${essays.map(essay => `
          <article class="ipes-card" data-category="${essay.category}">
            <div class="ipes-card-content">
              <div class="ipes-card-top">
                <span class="ipes-card-num">#${essay.number}</span>
                <span class="ipes-card-time">⏱️ ${essay.time}</span>
              </div>
              <h2 class="ipes-card-title">
                <a href="${essay.url}">${essay.title}</a>
              </h2>
              <div class="ipes-card-tags">
                ${essay.tags.map(t => `<span class="ipes-tag">${t}</span>`).join('')}
              </div>
              <p class="ipes-card-desc">${essay.desc}</p>
              <div class="ipes-card-footer">
                <a href="${essay.url}" class="ipes-read-btn">
                  <span>Ler Ensaio</span>
                  <span class="ipes-read-arrow">→</span>
                </a>
              </div>
            </div>
          </article>
        `).join('')}
      </div>

      <div class="ipes-reflection-box">
        <div class="ipes-reflection-icon">🌸</div>
        <div class="ipes-reflection-content">
          <h3>Entre a Resistência do Tijolo e a Flor do Ipê</h3>
          <p>
            Construir o futuro exige solidez moral (os tijolos) e sensibilidade estética (os ipês). Viver em plenitude é não abrir mão da firmeza ética nem da delicadeza com que acolhemos a existência.
          </p>
        </div>
      </div>
    `;

    const filterBtns = container.querySelectorAll('.ipes-filter-btn');
    const cards = container.querySelectorAll('.ipes-card');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        const filter = btn.getAttribute('data-filter');
        cards.forEach(c => {
          if (filter === 'all' || c.getAttribute('data-category') === filter) {
            c.style.display = 'flex';
          } else {
            c.style.display = 'none';
          }
        });
      });
    });
  }

  function renderEssayReader() {
    let currentEssay = null;
    let currentIndex = -1;
    const pageFilename = pathname.split('/').pop().replace(/\.html$/, '');

    for (let i = 0; i < essays.length; i++) {
      const eFilename = essays[i].url.split('/').pop().replace(/\.html$/, '');
      if (pageFilename === eFilename || pageFilename === essays[i].id) {
        currentEssay = essays[i];
        currentIndex = i;
        break;
      }
    }

    if (!currentEssay) {
      currentEssay = essays[0] || {
        id: 'ensaio',
        number: 1,
        title: (container.querySelector('h1, h2') || {}).innerText || 'Ipês e Tijolos',
        time: '2 min',
        tags: ['Reflexões'],
        url: baseUrl
      };
      currentIndex = 0;
    }

    const prevEssay = currentIndex > 0 ? essays[currentIndex - 1] : null;
    const nextEssay = (currentIndex >= 0 && currentIndex < essays.length - 1) ? essays[currentIndex + 1] : null;

    const rawNodes = Array.from(container.childNodes);
    const bodyElements = [];

    rawNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      const tagName = node.tagName.toLowerCase();
      if (tagName === 'h3' && (node.querySelector('a[href*="./"]') || node.innerText.toLowerCase().includes('ipês e tijolos'))) return;
      if (tagName === 'h2' && node.innerText.trim().toLowerCase() === (currentEssay.title || '').toLowerCase()) return;
      if (tagName === 'hr') return;
      if (tagName === 'div' && (node.innerText.includes('<<') || node.innerText.includes('>>') || node.style.clear === 'both')) return;
      bodyElements.push(node.cloneNode(true));
    });

    const ipesTags = currentEssay.tags || [];

    container.innerHTML = `
      <div class="ipes-reading-bar" id="ipes-reading-bar">
        <div class="ipes-reading-bar-left">
          <a href="${baseUrl}" class="ipes-nav-back-btn" title="Voltar ao Índice">
            <span>←</span> <span class="ipes-nav-back-text">Ipês e Tijolos</span>
          </a>
        </div>
        <div class="ipes-reading-controls">
          <button id="ipes-copy-btn" class="ipes-control-btn" title="Copiar ensaio completo" aria-label="Copiar Ensaio">
            <span>📋</span> <span id="ipes-copy-label">Copiar</span>
          </button>
          <button id="ipes-audio-btn" class="ipes-control-btn audio-btn" title="Ouvir ensaio" aria-label="Ouvir Ensaio">
            <span id="audio-icon">🔊</span> <span id="audio-label">Ouvir</span>
          </button>
        </div>
        <div class="ipes-progress-track">
          <div class="ipes-progress-bar" id="ipes-progress-bar"></div>
        </div>
      </div>

      <article class="ipes-article" id="ipes-article">
        <header class="ipes-article-header">
          <div class="ipes-meta-top">
            <span class="ipes-badge-pill">#${currentEssay.number || 1} de ${essays.length}</span>
            <span class="ipes-time-pill">⏱️ ${currentEssay.time || '2 min'} de leitura</span>
          </div>
          <h1 class="ipes-article-title">${currentEssay.title || 'Ensaio'}</h1>
          <div class="ipes-article-tags">
            ${ipesTags.map(t => `<span class="ipes-tag">${t}</span>`).join('')}
          </div>
        </header>

        <div class="ipes-article-body" id="ipes-body"></div>

        <nav class="ipes-nav-footer" aria-label="Navegação entre ensaios">
          ${prevEssay ? `
            <a href="${prevEssay.url}" class="ipes-nav-card prev">
              <span class="ipes-nav-dir">← Ensaio Anterior</span>
              <span class="ipes-nav-title">${prevEssay.number}. ${prevEssay.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="ipes-nav-card prev">
              <span class="ipes-nav-dir">← Coleção</span>
              <span class="ipes-nav-title">Índice Geral</span>
            </a>
          `}

          <a href="${baseUrl}" class="ipes-center-link" title="Voltar ao Índice">
            <span>🌸</span> <span>Ipês e Tijolos</span>
          </a>

          ${nextEssay ? `
            <a href="${nextEssay.url}" class="ipes-nav-card next">
              <span class="ipes-nav-dir">Próximo Ensaio →</span>
              <span class="ipes-nav-title">${nextEssay.number}. ${nextEssay.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="ipes-nav-card next">
              <span class="ipes-nav-dir">Fim da Coletânea →</span>
              <span class="ipes-nav-title">Voltar ao Início</span>
            </a>
          `}
        </nav>
      </article>
    `;

    const bodyEl = document.getElementById('ipes-body');
    bodyElements.forEach(el => bodyEl.appendChild(el));

    setupIpesInteractions(currentEssay);
  }

  function setupIpesInteractions(currentEssay) {
    const copyBtn = document.getElementById('ipes-copy-btn');
    const bodyEl = document.getElementById('ipes-body');

    if (copyBtn && bodyEl) {
      copyBtn.addEventListener('click', () => {
        const textToCopy = `${currentEssay.title}\n\n` + bodyEl.innerText.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = '<span>✓</span> <span>Copiado!</span>';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.innerHTML = originalHTML;
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        }
      });
    }

    const progressBar = document.getElementById('ipes-progress-bar');
    if (progressBar) {
      window.addEventListener('scroll', () => {
        const docEl = document.documentElement;
        const scrollTop = docEl.scrollTop || document.body.scrollTop;
        const scrollHeight = docEl.scrollHeight - docEl.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
      }, { passive: true });
    }

    const audioBtn = document.getElementById('ipes-audio-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioLabel = document.getElementById('audio-label');
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let utterance = null;

    if (audioBtn && synth) {
      audioBtn.addEventListener('click', () => {
        if (isPlaying) {
          synth.cancel();
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
          return;
        }

        const bodyEl = document.getElementById('ipes-body');
        const textToRead = bodyEl ? bodyEl.innerText : '';
        if (!textToRead) return;

        synth.cancel();
        utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;

        utterance.onstart = () => {
          isPlaying = true;
          audioBtn.classList.add('speaking');
          if (audioIcon) audioIcon.textContent = '⏹️';
          if (audioLabel) audioLabel.textContent = 'Parar';
        };

        utterance.onend = () => {
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
        };

        utterance.onerror = () => {
          isPlaying = false;
          audioBtn.classList.remove('speaking');
          if (audioIcon) audioIcon.textContent = '🔊';
          if (audioLabel) audioLabel.textContent = 'Ouvir';
        };

        synth.speak(utterance);
      });
    }
  }
})();
</script>
