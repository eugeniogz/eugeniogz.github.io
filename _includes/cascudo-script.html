<script id="cascudo-data" type="application/json">
{{ site.data.cascudo | jsonify }}
</script>
<script id="cascudo-cenas-data" type="application/json">
{{ site.data.cascudo_cenas | jsonify }}
</script>
<script>
(function() {
  // Evita inicialização dupla se já renderizado
  if (window.__cascudoInitialized) return;

  const container = document.getElementById('cascudo-app');
  if (!container) return;

  window.__cascudoInitialized = true;

  const pathname = window.location.pathname;
  const isIndex = pathname.endsWith('/o-cascudo-e-outras-historias/') || 
                  pathname.endsWith('/o-cascudo-e-outras-historias/index.html') || 
                  pathname.endsWith('/o-cascudo-e-outras-historias');

  const baseUrl = pathname.includes('/o-cascudo-e-outras-historias/') 
    ? pathname.substring(0, pathname.indexOf('/o-cascudo-e-outras-historias/') + '/o-cascudo-e-outras-historias/'.length)
    : '/o-cascudo-e-outras-historias/';

  // Metadados dos 7 contos da coleção
  const dataEl = document.getElementById('cascudo-data');
  let rawStories = [];
  try {
    rawStories = dataEl ? JSON.parse(dataEl.textContent || '[]') : [];
  } catch (e) {
    rawStories = [];
  }

  // Metadados pré-processados de cenas
  const cenasDataEl = document.getElementById('cascudo-cenas-data');
  let allCenasCatalog = {};
  try {
    allCenasCatalog = cenasDataEl ? JSON.parse(cenasDataEl.textContent || '{}') : {};
  } catch (e) {
    allCenasCatalog = {};
  }

  const stories = (rawStories || []).map(s => ({
    ...s,
    cover: s.cover ? (s.cover.startsWith('http') ? s.cover : baseUrl + s.cover) : '',
    url: baseUrl + (s.filename || (s.id + '.html'))
  }));

  // =========================================================================
  // HELPER: SELETOR DE VOZ NEURAL / NATURAL DE ALTA QUALIDADE
  // =========================================================================
  function getBestNaturalVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    // Prioridade 1: Vozes neurais / online / Google em Português do Brasil
    const naturalPtBr = voices.find(v => 
      v.lang.replace('_', '-').toLowerCase().startsWith('pt') &&
      (v.name.includes('Francisca') || v.name.includes('Antonio') || v.name.includes('Thalita') || 
       v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Online') || 
       v.name.includes('Google') || v.name.includes('Premium') || v.name.includes('Enhanced') ||
       v.name.includes('Luciana') || v.name.includes('Felipe') || v.name.includes('Yara') || v.name.includes('Letícia'))
    );
    if (naturalPtBr) return naturalPtBr;

    // Prioridade 2: Qualquer voz pt-BR
    const anyPtBr = voices.find(v => v.lang.replace('_', '-').toLowerCase() === 'pt-br');
    if (anyPtBr) return anyPtBr;

    // Prioridade 3: Qualquer voz em português
    return voices.find(v => v.lang.startsWith('pt'));
  }

  // Carrega vozes antecipadamente no Chrome/Firefox
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => getBestNaturalVoice();
  }

  // =========================================================================
  // RENDERIZAÇÃO DA PÁGINA ÍNDICE / HUB
  // =========================================================================
  if (isIndex) {
    renderIndexHub();
    return;
  }

  // =========================================================================
  // RENDERIZAÇÃO DA PÁGINA INDIVIDUAL DO CONTO
  // =========================================================================
  renderStoryReader();

  function renderIndexHub() {
    container.innerHTML = `
      <div class="cascudo-hero">
        <div class="cascudo-hero-badge">
          <span>🌿</span> Contos Infantis & Infantojuvenis
        </div>
        <h1 class="cascudo-hero-title">O Cascudo e Outras Histórias</h1>
        <p class="cascudo-hero-subtitle">
          Contos para pequenos aventureiros: experiências na fazenda, na praia e na cidade.
          Histórias ilustradas que despertam a imaginação, o afeto e a reflexão em família.
        </p>

        <div class="cascudo-stats-pills">
          <div class="cascudo-stat-pill">
            <span class="cascudo-stat-icon">📚</span>
            <span><strong>7</strong> Histórias Ilustradas</span>
          </div>
          <div class="cascudo-stat-pill">
            <span class="cascudo-stat-icon">🎬</span>
            <span><strong>Modo Animação</strong> Integrado</span>
          </div>
          <div class="cascudo-stat-pill">
            <span class="cascudo-stat-icon">🔠</span>
            <span>Modo Caixa Alta</span>
          </div>
          <div class="cascudo-stat-pill">
            <span class="cascudo-stat-icon">🔊</span>
            <span>Áudio & Narração</span>
          </div>
        </div>
      </div>

      <!-- Filtros de Categoria -->
      <div class="cascudo-filters-bar" role="tablist" aria-label="Filtrar histórias por tema">
        <button class="cascudo-filter-btn active" data-filter="all" role="tab" aria-selected="true">
          ✨ Todas as Histórias (${stories.length})
        </button>
        <button class="cascudo-filter-btn" data-filter="natureza" role="tab" aria-selected="false">
          🌱 Natureza & Rio
        </button>
        <button class="cascudo-filter-btn" data-filter="familia" role="tab" aria-selected="false">
          👨‍👩‍👧‍👦 Família & Aventura
        </button>
        <button class="cascudo-filter-btn" data-filter="aprendizados" role="tab" aria-selected="false">
          🎨 Aprendizados & Paciência
        </button>
        <button class="cascudo-filter-btn" data-filter="tecnologia" role="tab" aria-selected="false">
          ⏳ Tempo & Telas
        </button>
      </div>

      <!-- Grid de Cartões de Histórias -->
      <div class="cascudo-grid" id="cascudo-stories-grid">
        ${stories.map(story => `
          <article class="cascudo-card" data-category="${story.category}">
            <a href="${story.url}" class="cascudo-card-media" aria-label="Ler ${story.title}">
              <img src="${story.cover}" alt="Ilustração do conto ${story.title}" loading="lazy" />
              <span class="cascudo-card-num">Conto ${story.number}</span>
              <span class="cascudo-card-time">⏱️ ${story.time}</span>
            </a>
            <div class="cascudo-card-content">
              <div class="cascudo-card-tags">
                ${story.tags.map(t => `<span class="cascudo-tag">${t}</span>`).join('')}
              </div>
              <h2 class="cascudo-card-title">
                <a href="${story.url}">${story.title}</a>
              </h2>
              <p class="cascudo-card-desc">${story.desc}</p>
              <div class="cascudo-card-footer">
                <a href="${story.url}" class="cascudo-read-btn">
                  <span>Ler História</span>
                  <span class="cascudo-read-arrow">→</span>
                </a>
              </div>
            </div>
          </article>
        `).join('')}
      </div>

      <!-- Caixa de Dicas para Leitura em Família -->
      <div class="cascudo-family-box">
        <div class="cascudo-family-icon">💡</div>
        <div class="cascudo-family-content">
          <h3>Dica para Pais, Avós e Educadores</h3>
          <p>
            Ao ler cada história com as crianças, utilize o recurso de <strong>Caixa Alta</strong> para incentivar os primeiros passos da alfabetização e explore o <strong>Modo Animação</strong> para uma experiência envolvente de leitura compartilhada com ilustrações sincronizadas à narração.
          </p>
        </div>
      </div>
    `;

    // Interatividade dos filtros
    const filterButtons = container.querySelectorAll('.cascudo-filter-btn');
    const cards = container.querySelectorAll('.cascudo-card');

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');

        const filter = btn.getAttribute('data-filter');
        cards.forEach(card => {
          if (filter === 'all' || card.getAttribute('data-category') === filter) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  }

  function renderStoryReader() {
    let currentStory = null;
    let currentIndex = -1;

    const pageFilename = pathname.split('/').pop().replace(/\.html$/, '');

    for (let i = 0; i < stories.length; i++) {
      const storyFilename = stories[i].url.split('/').pop().replace(/\.html$/, '');
      if (pageFilename === storyFilename || pageFilename === stories[i].id) {
        currentStory = stories[i];
        currentIndex = i;
        break;
      }
    }

    if (!currentStory) {
      const originalH2 = container.querySelector('h2');
      const headingText = originalH2 ? originalH2.innerText.trim().toLowerCase() : '';
      if (headingText) {
        for (let i = 0; i < stories.length; i++) {
          if (headingText === stories[i].title.toLowerCase()) {
            currentStory = stories[i];
            currentIndex = i;
            break;
          }
        }
      }
    }

    if (!currentStory) {
      currentStory = stories[0];
      currentIndex = 0;
    }

    const prevStory = currentIndex > 0 ? stories[currentIndex - 1] : null;
    const nextStory = currentIndex < stories.length - 1 ? stories[currentIndex + 1] : null;

    // Coleta o conteúdo original do conto
    const rawNodes = Array.from(container.childNodes);
    const storyElements = [];

    rawNodes.forEach(node => {
      if (node.nodeType !== 1) return;
      const tagName = node.tagName.toLowerCase();

      if (tagName === 'h3' && (node.querySelector('a[href*="./"]') || node.innerText.toLowerCase().includes('o cascudo e outras histórias'))) return;
      if (tagName === 'h2' && node.innerText.trim().toLowerCase() === currentStory.title.toLowerCase()) return;
      if (tagName === 'hr') return;
      if (tagName === 'div' && (node.innerText.includes('<<') || node.innerText.includes('>>') || node.style.clear === 'both')) return;

      storyElements.push(node.cloneNode(true));
    });

    // Monta a estrutura da página
    container.innerHTML = `
      <!-- Barra de Leitura Superior Fixa/Acessível -->
      <div class="cascudo-reading-bar" id="cascudo-reading-bar">
        <div class="cascudo-reading-bar-left">
          <a href="${baseUrl}" class="cascudo-nav-back-btn" title="Voltar ao Índice de Contos">
            <span>←</span> <span class="cascudo-nav-back-text">Todas as Histórias</span>
          </a>
        </div>

        <div class="cascudo-reading-controls">
          <!-- Botão Modo Animação / Teatro -->
          <button id="cascudo-theater-btn" class="cascudo-control-btn theater-btn" title="Assistir à história em Modo Animação com figuras e voz sincronizada" aria-label="Modo Animação">
            <span>🎬</span> <span>Animação</span>
          </button>

          <!-- Botão Caixa Alta -->
          <button id="cascudo-case-btn" class="cascudo-control-btn" title="Alternar entre Letra Normal e CAIXA ALTA" aria-label="Alternar Caixa Alta">
            <span>🔠</span> <span id="cascudo-case-label">CAIXA ALTA</span>
          </button>

          <!-- Ajuste de Tamanho de Fonte -->
          <div class="cascudo-font-resizer" role="group" aria-label="Tamanho da Letra">
            <button id="font-dec-btn" class="cascudo-font-btn" title="Diminuir tamanho da letra">A-</button>
            <button id="font-reset-btn" class="cascudo-font-btn" title="Tamanho padrão">A</button>
            <button id="font-inc-btn" class="cascudo-font-btn" title="Aumentar tamanho da letra">A+</button>
          </div>

          <!-- Áudio Narração do Artigo -->
          <button id="cascudo-audio-btn" class="cascudo-control-btn audio-btn" title="Ouvir a história narrada" aria-label="Ouvir História">
            <span id="audio-icon">🔊</span> <span id="audio-label">Ouvir</span>
          </button>
        </div>

        <!-- Barra de Progresso de Leitura -->
        <div class="cascudo-progress-track">
          <div class="cascudo-progress-bar" id="cascudo-progress-bar"></div>
        </div>
      </div>

      <!-- Artigo Principal da História -->
      <article class="cascudo-story-article" id="cascudo-story-article">
        <!-- Cabeçalho do Conto -->
        <header class="cascudo-story-header">
          <div class="cascudo-story-meta-top">
            <span class="cascudo-story-num-badge">Conto ${currentStory.number} de ${stories.length}</span>
            <span class="cascudo-story-time-badge">⏱️ ${currentStory.time} de leitura</span>
          </div>

          <h1 class="cascudo-story-title">${currentStory.title}</h1>

          <div class="cascudo-story-tags">
            ${currentStory.tags.map(t => `<span class="cascudo-tag">${t}</span>`).join('')}
          </div>

          <div style="margin-top: 1rem;">
            <button id="cascudo-theater-hero-btn" class="cascudo-theater-btn-hero">
              <span>🎬</span> <span>Assistir História Animada</span>
            </button>
          </div>
        </header>

        <!-- Corpo do Conto com Texto e Imagens -->
        <div class="cascudo-story-body" id="cascudo-story-body">
        </div>

        <!-- Caixa de Reflexão em Família -->
        <div class="cascudo-story-reflection-card">
          <div class="cascudo-reflection-header">
            <span class="cascudo-reflection-icon">💡</span>
            <h3>${currentStory.reflection.title}</h3>
          </div>
          <ul class="cascudo-reflection-list">
            ${currentStory.reflection.questions.map(q => `<li>${q}</li>`).join('')}
          </ul>
        </div>

        <!-- Rodapé de Navegação Entre Contos -->
        <nav class="cascudo-story-nav-footer" aria-label="Navegação entre histórias">
          ${prevStory ? `
            <a href="${prevStory.url}" class="cascudo-story-nav-card prev">
              <span class="cascudo-nav-direction">← Conto Anterior</span>
              <span class="cascudo-nav-card-title">${prevStory.number}. ${prevStory.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="cascudo-story-nav-card prev">
              <span class="cascudo-nav-direction">← Coleção</span>
              <span class="cascudo-nav-card-title">Índice de Histórias</span>
            </a>
          `}

          <a href="${baseUrl}" class="cascudo-center-hub-link" title="Voltar ao início da coleção">
            <span>📖</span> <span>Todas as Histórias</span>
          </a>

          ${nextStory ? `
            <a href="${nextStory.url}" class="cascudo-story-nav-card next">
              <span class="cascudo-nav-direction">Próximo Conto →</span>
              <span class="cascudo-nav-card-title">${nextStory.number}. ${nextStory.title}</span>
            </a>
          ` : `
            <a href="${baseUrl}" class="cascudo-story-nav-card next">
              <span class="cascudo-nav-direction">Fim da Coleção →</span>
              <span class="cascudo-nav-card-title">Voltar ao Início</span>
            </a>
          `}
        </nav>
      </article>

      <!-- Lightbox Modal para Imagens -->
      <div id="cascudo-lightbox" class="cascudo-lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <button class="cascudo-lightbox-close" id="lightbox-close-btn" aria-label="Fechar visualização da imagem">✕</button>
        <img id="cascudo-lightbox-img" src="" alt="Visualização ampliada da ilustração" />
        <p id="cascudo-lightbox-caption" class="cascudo-lightbox-caption"></p>
      </div>

      <!-- MODAL DO MODO TEATRO / ANIMAÇÃO DA HISTÓRIA -->
      <div id="cascudo-theater-modal" class="cascudo-theater-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <!-- Barra Superior do Teatro -->
        <div class="cascudo-theater-header">
          <div class="cascudo-theater-title-box">
            <span class="cascudo-theater-scene-badge" id="theater-scene-badge">Cena 1 de 4</span>
            <h2 class="cascudo-theater-story-title" id="theater-story-title">${currentStory.title}</h2>
          </div>
          <div class="cascudo-theater-top-actions">
            <button id="theater-case-btn" class="cascudo-theater-action-btn" title="Alternar Caixa Alta">
              <span>🔠</span> <span id="theater-case-label">CAIXA ALTA</span>
            </button>
            <button id="theater-close-btn" class="cascudo-theater-close-btn" title="Fechar Animação (Esc)" aria-label="Fechar Animação">✕</button>
          </div>
        </div>

        <!-- Palco Central -->
        <div class="cascudo-theater-stage">
          <div class="cascudo-theater-visual-wrap">
            <img id="theater-img" class="cascudo-theater-img" src="" alt="Cena da história" />
          </div>
          <div class="cascudo-theater-caption" id="theater-caption">
            <p id="theater-text" class="cascudo-theater-text"></p>
          </div>
        </div>

        <!-- Barra Inferior de Controles -->
        <div class="cascudo-theater-footer">
          <div class="cascudo-theater-timeline" id="theater-timeline"></div>
          <div class="cascudo-theater-controls">
            <button id="theater-prev-btn" class="cascudo-theater-ctrl-btn" title="Cena Anterior (Seta Esquerda)" aria-label="Cena Anterior">⏮️</button>
            <button id="theater-play-btn" class="cascudo-theater-ctrl-btn play-btn" title="Tocar / Pausar (Espaço)" aria-label="Tocar / Pausar">▶️</button>
            <button id="theater-next-btn" class="cascudo-theater-ctrl-btn" title="Próxima Cena (Seta Direita)" aria-label="Próxima Cena">⏭️</button>
            <button id="theater-replay-btn" class="cascudo-theater-ctrl-btn" title="Repetir esta cena" aria-label="Repetir Cena">🔁</button>
            <div class="cascudo-theater-volume-wrap" title="Volume da Narração">
              <button id="theater-volume-btn" class="cascudo-theater-ctrl-btn volume-btn" title="Ajustar Volume / Mudo" aria-label="Ajustar Volume">🔉</button>
              <input type="range" id="theater-volume-slider" class="cascudo-volume-slider" min="0" max="1" step="0.05" value="0.65" aria-label="Controle de volume da voz narrativa" />
            </div>
          </div>
          <div class="cascudo-theater-shortcuts-hint">
            Dica: use as setas do teclado ⬅️ ➡️ para mudar de cena e [Espaço] para pausar
          </div>
        </div>
      </div>
    `;

    // Storage helpers
    function getStorage(key) {
      try { return window.localStorage ? window.localStorage.getItem(key) : null; } catch(e) { return null; }
    }
    function setStorage(key, val) {
      try { if (window.localStorage) window.localStorage.setItem(key, val); } catch(e) {}
    }

    // Volume padrão da voz narrativa (iniciando em nível mais suave/baixo: 0.65)
    const savedVolume = getStorage('cascudo-narration-volume');
    let currentVolume = savedVolume !== null ? parseFloat(savedVolume) : 0.65;
    if (isNaN(currentVolume) || currentVolume < 0 || currentVolume > 1) {
      currentVolume = 0.65;
    }
    let lastNonZeroVolume = currentVolume > 0 ? currentVolume : 0.65;

    // Insere o conteúdo original tratado no corpo
    const storyBody = document.getElementById('cascudo-story-body');
    const extractedScenes = [];

    // Parser inteligente de cenas a partir do DOM
    storyElements.forEach(el => {
      const imgs = el.querySelectorAll('img');
      imgs.forEach(img => {
        img.classList.add('cascudo-story-img');
        img.setAttribute('title', 'Clique para ampliar a ilustração');
        img.addEventListener('click', () => openLightbox(img.src, img.alt));
      });
      storyBody.appendChild(el);
    });

    // -----------------------------------------------------------------------
    // EXTRAÇÃO E SINCRONIZAÇÃO DE CENAS (JSON ou Fallback DOM)
    // -----------------------------------------------------------------------
    let storyScenes = allCenasCatalog[currentStory.id] || null;

    if (!storyScenes || storyScenes.length === 0) {
      // Fallback dinâmico: extrai as imagens e textos do corpo renderizado
      const domImgs = storyBody.querySelectorAll('img');
      const paragraphs = Array.from(storyBody.querySelectorAll('p'));

      if (domImgs.length > 0) {
        storyScenes = [];
        domImgs.forEach((img, idx) => {
          let sceneText = '';
          const parentP = img.closest('p');
          if (parentP) {
            sceneText = parentP.innerText.trim();
          } else if (paragraphs[idx]) {
            sceneText = paragraphs[idx].innerText.trim();
          }
          if (!sceneText && paragraphs.length > 0) {
            sceneText = paragraphs.map(p => p.innerText.trim()).join(' ');
          }

          let relSrc = img.getAttribute('src') || '';
          if (relSrc.startsWith('./')) relSrc = relSrc.substring(2);

          storyScenes.push({
            scene_number: idx + 1,
            image: relSrc,
            alt: img.alt || currentStory.title,
            text: sceneText || currentStory.title,
            audio: `audio/${currentStory.id}/cena-${idx + 1}.mp3`
          });
        });
      }
    }

    // Se ainda assim não tiver cenas, cria uma cena padrão com a capa
    if (!storyScenes || storyScenes.length === 0) {
      storyScenes = [{
        scene_number: 1,
        image: currentStory.cover,
        alt: currentStory.title,
        text: currentStory.title + '. ' + storyBody.innerText.trim(),
        audio: `audio/${currentStory.id}/cena-1.mp3`
      }];
    }

    // -----------------------------------------------------------------------
    // MODO TEATRO / ANIMAÇÃO INTERATIVA
    // -----------------------------------------------------------------------
    const theaterModal = document.getElementById('cascudo-theater-modal');
    const theaterBtn = document.getElementById('cascudo-theater-btn');
    const theaterHeroBtn = document.getElementById('cascudo-theater-hero-btn');
    const theaterCloseBtn = document.getElementById('theater-close-btn');
    const theaterCaseBtn = document.getElementById('theater-case-btn');
    const theaterImg = document.getElementById('theater-img');
    const theaterText = document.getElementById('theater-text');
    const theaterCaption = document.getElementById('theater-caption');
    const theaterSceneBadge = document.getElementById('theater-scene-badge');
    const theaterTimeline = document.getElementById('theater-timeline');
    const theaterPlayBtn = document.getElementById('theater-play-btn');
    const theaterPrevBtn = document.getElementById('theater-prev-btn');
    const theaterNextBtn = document.getElementById('theater-next-btn');
    const theaterReplayBtn = document.getElementById('theater-replay-btn');
    const theaterVolumeBtn = document.getElementById('theater-volume-btn');
    const theaterVolumeSlider = document.getElementById('theater-volume-slider');

    let currentSceneIdx = 0;
    let isTheaterPlaying = false;
    let theaterAudio = new Audio();
    theaterAudio.volume = currentVolume;
    let theaterSpeechUtterance = null;
    let theaterAdvanceTimeout = null;

    function updateVolumeUI(vol) {
      if (theaterVolumeSlider) theaterVolumeSlider.value = vol;
      if (!theaterVolumeBtn) return;
      if (vol === 0) {
        theaterVolumeBtn.innerText = '🔇';
        theaterVolumeBtn.setAttribute('title', 'Ativar Som (Mudo)');
      } else if (vol < 0.4) {
        theaterVolumeBtn.innerText = '🔈';
        theaterVolumeBtn.setAttribute('title', `Volume: ${Math.round(vol * 100)}% (Clique para Mudo)`);
      } else if (vol < 0.75) {
        theaterVolumeBtn.innerText = '🔉';
        theaterVolumeBtn.setAttribute('title', `Volume: ${Math.round(vol * 100)}% (Clique para Mudo)`);
      } else {
        theaterVolumeBtn.innerText = '🔊';
        theaterVolumeBtn.setAttribute('title', `Volume: ${Math.round(vol * 100)}% (Clique para Mudo)`);
      }
    }

    function setVolume(vol) {
      currentVolume = Math.max(0, Math.min(1, vol));
      setStorage('cascudo-narration-volume', currentVolume);
      if (theaterAudio) theaterAudio.volume = currentVolume;
      if (theaterSpeechUtterance) theaterSpeechUtterance.volume = currentVolume;
      updateVolumeUI(currentVolume);
    }

    if (theaterVolumeSlider) {
      theaterVolumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (val > 0) lastNonZeroVolume = val;
      });
    }

    if (theaterVolumeBtn) {
      theaterVolumeBtn.addEventListener('click', () => {
        if (currentVolume > 0) {
          lastNonZeroVolume = currentVolume;
          setVolume(0);
        } else {
          setVolume(lastNonZeroVolume || 0.65);
        }
      });
    }

    // Inicializa ícone e controle de volume
    updateVolumeUI(currentVolume);

    // Renderiza os marcadores da timeline
    function renderTimeline() {
      if (!theaterTimeline) return;
      theaterTimeline.innerHTML = storyScenes.map((sc, i) => `
        <div class="cascudo-scene-pill ${i === currentSceneIdx ? 'active' : ''} ${i < currentSceneIdx ? 'completed' : ''}" 
             data-scene="${i}" title="Cena ${i + 1}"></div>
      `).join('');

      theaterTimeline.querySelectorAll('.cascudo-scene-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const targetIdx = parseInt(pill.getAttribute('data-scene'), 10);
          goToScene(targetIdx, isTheaterPlaying);
        });
      });
    }

    function stopAllAudio() {
      if (theaterAdvanceTimeout) {
        clearTimeout(theaterAdvanceTimeout);
        theaterAdvanceTimeout = null;
      }
      theaterAudio.pause();
      theaterAudio.currentTime = 0;
      theaterAudio.onended = null;
      theaterAudio.onerror = null;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function goToScene(index, autoPlay = true) {
      stopAllAudio();
      currentSceneIdx = Math.max(0, Math.min(storyScenes.length - 1, index));
      const scene = storyScenes[currentSceneIdx];

      // Resolve URL da imagem
      let imgSrc = scene.image;
      if (!imgSrc.startsWith('http') && !imgSrc.startsWith('/')) {
        imgSrc = baseUrl + imgSrc;
      }
      theaterImg.src = imgSrc;
      theaterImg.alt = scene.alt || `Cena ${scene.scene_number}`;

      // Atualiza texto, scroll e badges
      theaterText.innerText = scene.text;
      if (theaterCaption) theaterCaption.scrollTop = 0;
      theaterSceneBadge.innerText = `Cena ${currentSceneIdx + 1} de ${storyScenes.length}`;
      renderTimeline();

      if (autoPlay) {
        playCurrentScene();
      } else {
        pauseTheater();
      }
    }

    function playCurrentScene() {
      stopAllAudio();
      isTheaterPlaying = true;
      theaterModal.classList.add('playing');
      theaterPlayBtn.innerText = '⏸️';
      theaterPlayBtn.setAttribute('title', 'Pausar');

      const scene = storyScenes[currentSceneIdx];
      let audioUrl = scene.audio;
      if (!audioUrl.startsWith('http') && !audioUrl.startsWith('/')) {
        audioUrl = baseUrl + audioUrl;
      }

      // Tenta tocar o arquivo MP3 gerado por IA
      theaterAudio.src = audioUrl;
      theaterAudio.volume = currentVolume;
      theaterAudio.playbackRate = 1.0;

      const playPromise = theaterAudio.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          // Áudio MP3 tocou com sucesso
          theaterAudio.onended = onSceneAudioEnded;
        }).catch(() => {
          // Fallback para Web Speech API com voz neural se o MP3 não for encontrado ou bloqueado
          playWithWebSpeech(scene.text);
        });
      } else {
        theaterAudio.onended = onSceneAudioEnded;
      }
    }

    function playWithWebSpeech(text) {
      if (!('speechSynthesis' in window)) {
        // Se navegador não tiver suporte, aguarda 5s e avança
        theaterAdvanceTimeout = setTimeout(onSceneAudioEnded, 5000);
        return;
      }

      window.speechSynthesis.cancel();
      theaterSpeechUtterance = new SpeechSynthesisUtterance(text);
      theaterSpeechUtterance.lang = 'pt-BR';
      theaterSpeechUtterance.rate = 0.86; // Cadência mais lenta e narrativa
      theaterSpeechUtterance.volume = currentVolume;

      const naturalVoice = getBestNaturalVoice();
      if (naturalVoice) theaterSpeechUtterance.voice = naturalVoice;

      theaterSpeechUtterance.onend = onSceneAudioEnded;
      theaterSpeechUtterance.onerror = onSceneAudioEnded;

      window.speechSynthesis.speak(theaterSpeechUtterance);
    }

    function onSceneAudioEnded() {
      if (!isTheaterPlaying) return;

      if (currentSceneIdx < storyScenes.length - 1) {
        // Pausa suave e natural de 1.1s entre cenas
        theaterAdvanceTimeout = setTimeout(() => {
          goToScene(currentSceneIdx + 1, true);
        }, 1100);
      } else {
        // Fim da história
        isTheaterPlaying = false;
        theaterModal.classList.remove('playing');
        theaterPlayBtn.innerText = '▶️';
        theaterPlayBtn.setAttribute('title', 'Reproduzir');
        theaterSceneBadge.innerText = 'História Concluída! 🎉';
      }
    }

    function pauseTheater() {
      isTheaterPlaying = false;
      theaterModal.classList.remove('playing');
      theaterPlayBtn.innerText = '▶️';
      theaterPlayBtn.setAttribute('title', 'Reproduzir');
      stopAllAudio();
    }

    function openTheater() {
      // Para qualquer reprodução de áudio da página normal
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeaking = false;
      if (audioBtn) {
        audioBtn.classList.remove('speaking');
        if (audioIcon) audioIcon.innerText = '🔊';
        if (audioLabel) audioLabel.innerText = 'Ouvir';
      }

      theaterModal.classList.add('open');
      theaterModal.setAttribute('aria-hidden', 'false');
      goToScene(0, true);
    }

    function closeTheater() {
      pauseTheater();
      theaterModal.classList.remove('open');
      theaterModal.setAttribute('aria-hidden', 'true');
    }

    if (theaterBtn) theaterBtn.addEventListener('click', openTheater);
    if (theaterHeroBtn) theaterHeroBtn.addEventListener('click', openTheater);
    if (theaterCloseBtn) theaterCloseBtn.addEventListener('click', closeTheater);

    if (theaterPlayBtn) {
      theaterPlayBtn.addEventListener('click', () => {
        if (isTheaterPlaying) pauseTheater();
        else playCurrentScene();
      });
    }

    if (theaterPrevBtn) {
      theaterPrevBtn.addEventListener('click', () => {
        goToScene(currentSceneIdx - 1, isTheaterPlaying);
      });
    }

    if (theaterNextBtn) {
      theaterNextBtn.addEventListener('click', () => {
        goToScene(currentSceneIdx + 1, isTheaterPlaying);
      });
    }

    if (theaterReplayBtn) {
      theaterReplayBtn.addEventListener('click', () => {
        goToScene(currentSceneIdx, true);
      });
    }

    // Atalhos de teclado no modo teatro
    document.addEventListener('keydown', (e) => {
      if (!theaterModal.classList.contains('open')) return;

      if (e.key === 'Escape') {
        closeTheater();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (isTheaterPlaying) pauseTheater();
        else playCurrentScene();
      } else if (e.key === 'ArrowRight') {
        goToScene(currentSceneIdx + 1, isTheaterPlaying);
      } else if (e.key === 'ArrowLeft') {
        goToScene(currentSceneIdx - 1, isTheaterPlaying);
      } else if (e.key === 'r' || e.key === 'R') {
        goToScene(currentSceneIdx, true);
      }
    });

    // -----------------------------------------------------------------------
    // CONTROLE DE CAIXA ALTA (Persistente via LocalStorage)
    // -----------------------------------------------------------------------
    const caseBtn = document.getElementById('cascudo-case-btn');
    const caseLabel = document.getElementById('cascudo-case-label');
    const theaterCaseLabel = document.getElementById('theater-case-label');
    const mainContent = document.getElementById('main-content') || document.body;

    function applyCasePreference(isUpper) {
      if (isUpper) {
        mainContent.classList.add('text-uppercase-active');
        if (caseLabel) caseLabel.innerText = 'Letra Normal';
        if (theaterCaseLabel) theaterCaseLabel.innerText = 'Letra Normal';
        if (caseBtn) caseBtn.classList.add('active');
        setStorage('text-case-preference', 'uppercase');
      } else {
        mainContent.classList.remove('text-uppercase-active');
        if (caseLabel) caseLabel.innerText = 'CAIXA ALTA';
        if (theaterCaseLabel) theaterCaseLabel.innerText = 'CAIXA ALTA';
        if (caseBtn) caseBtn.classList.remove('active');
        setStorage('text-case-preference', 'normal');
      }
    }

    if (caseBtn) {
      caseBtn.addEventListener('click', () => {
        const isCurrentlyUpper = mainContent.classList.contains('text-uppercase-active');
        applyCasePreference(!isCurrentlyUpper);
      });
    }

    if (theaterCaseBtn) {
      theaterCaseBtn.addEventListener('click', () => {
        const isCurrentlyUpper = mainContent.classList.contains('text-uppercase-active');
        applyCasePreference(!isCurrentlyUpper);
      });
    }

    const savedCase = getStorage('text-case-preference');
    applyCasePreference(savedCase === 'uppercase');

    // -----------------------------------------------------------------------
    // CONTROLE DE TAMANHO DE FONTE (A- / A / A+)
    // -----------------------------------------------------------------------
    const fontDecBtn = document.getElementById('font-dec-btn');
    const fontResetBtn = document.getElementById('font-reset-btn');
    const fontIncBtn = document.getElementById('font-inc-btn');

    const fontSizes = ['font-size-sm', 'font-size-md', 'font-size-lg', 'font-size-xl'];
    let currentFontIndex = 1;

    function setFontSize(index) {
      fontSizes.forEach(cls => storyBody.classList.remove(cls));
      currentFontIndex = Math.max(0, Math.min(fontSizes.length - 1, index));
      storyBody.classList.add(fontSizes[currentFontIndex]);
      setStorage('cascudo-font-size-idx', currentFontIndex);
    }

    if (fontDecBtn) fontDecBtn.addEventListener('click', () => setFontSize(currentFontIndex - 1));
    if (fontResetBtn) fontResetBtn.addEventListener('click', () => setFontSize(1));
    if (fontIncBtn) fontIncBtn.addEventListener('click', () => setFontSize(currentFontIndex + 1));

    const savedFontIdx = getStorage('cascudo-font-size-idx');
    if (savedFontIdx !== null) {
      setFontSize(parseInt(savedFontIdx, 10));
    }

    // -----------------------------------------------------------------------
    // BARRA DE PROGRESSO DE LEITURA
    // -----------------------------------------------------------------------
    const progressBar = document.getElementById('cascudo-progress-bar');
    window.addEventListener('scroll', () => {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      if (docHeight > 0 && progressBar) {
        const scrolled = (window.scrollY / docHeight) * 100;
        progressBar.style.width = Math.min(100, Math.max(0, scrolled)) + '%';
      }
    }, { passive: true });

    // -----------------------------------------------------------------------
    // ÁUDIO NARRAÇÃO DO ARTIGO COMPLETO (Web Speech Synthesis Otimizada)
    // -----------------------------------------------------------------------
    const audioBtn = document.getElementById('cascudo-audio-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioLabel = document.getElementById('audio-label');
    let isSpeaking = false;

    if ('speechSynthesis' in window && audioBtn) {
      audioBtn.addEventListener('click', () => {
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          isSpeaking = false;
          audioIcon.innerText = '🔊';
          audioLabel.innerText = 'Ouvir';
          audioBtn.classList.remove('speaking');
          return;
        }

        const textToRead = currentStory.title + '. ' + storyBody.innerText;
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.88;
        utterance.volume = currentVolume;

        const bestVoice = getBestNaturalVoice();
        if (bestVoice) utterance.voice = bestVoice;

        utterance.onstart = () => {
          isSpeaking = true;
          audioIcon.innerText = '⏹️';
          audioLabel.innerText = 'Pausar';
          audioBtn.classList.add('speaking');
        };

        utterance.onend = utterance.onerror = () => {
          isSpeaking = false;
          audioIcon.innerText = '🔊';
          audioLabel.innerText = 'Ouvir';
          audioBtn.classList.remove('speaking');
        };

        window.speechSynthesis.speak(utterance);
      });

      window.addEventListener('beforeunload', () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        stopAllAudio();
      });
    } else if (audioBtn) {
      audioBtn.style.display = 'none';
    }

    // -----------------------------------------------------------------------
    // LIGHTBOX DE IMAGENS
    // -----------------------------------------------------------------------
    const lightbox = document.getElementById('cascudo-lightbox');
    const lightboxImg = document.getElementById('cascudo-lightbox-img');
    const lightboxCaption = document.getElementById('cascudo-lightbox-caption');
    const lightboxClose = document.getElementById('lightbox-close-btn');

    function openLightbox(src, caption) {
      if (!lightbox || !lightboxImg) return;
      lightboxImg.src = src;
      if (lightboxCaption) lightboxCaption.innerText = caption || '';
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      if (!lightbox) return;
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
    }

    if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
    if (lightbox) {
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target === lightboxClose) closeLightbox();
      });
    }
  }
})();
</script>
